name: Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    name: Go Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"

      - name: Run golangci-lint
        id: lint
        uses: golangci/golangci-lint-action@master
