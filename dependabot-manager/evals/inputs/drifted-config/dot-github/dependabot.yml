version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    labels:
      - "dependencies"
      - "node"
      - "frontend"
    reviewers:
      - "acme/platform-team"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "python"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 0

  - package-ecosystem: "dotnet"
    directory: "/"
    schedule:
      interval: "daily"
