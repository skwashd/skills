# Infrastructure-as-code ecosystems
# Drop these entries into the `updates:` block of .github/dependabot.yml.
# `opentofu` uses the terraform label because the community treats them as the same ecosystem.

  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "terraform"

  - package-ecosystem: "opentofu"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "terraform"

  - package-ecosystem: "bazel"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "bazel"

  - package-ecosystem: "nix"            # Nix flakes — note the value is `nix`, not `nix-flakes`
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "nix"
