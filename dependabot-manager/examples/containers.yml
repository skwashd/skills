# Container ecosystems
# Drop these entries into the `updates:` block of .github/dependabot.yml.
# `docker` and `docker-compose` are separate ecosystems and need separate entries.

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "helm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    labels:
      - "dependencies"
      - "helm"
