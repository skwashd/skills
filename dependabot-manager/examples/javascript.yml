# JavaScript / TypeScript ecosystems
# Drop these entries into the `updates:` block of .github/dependabot.yml

  - package-ecosystem: "npm"            # covers npm, pnpm, and Yarn
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "node"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "deno"           # Deno v2 and later
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "javascript"
