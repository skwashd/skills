# Other ecosystems
# Drop these entries into the `updates:` block of .github/dependabot.yml

  - package-ecosystem: "mix"            # Elixir
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "elixir"

  - package-ecosystem: "pub"            # Dart / Flutter
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "dart"

  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "julia"

  - package-ecosystem: "elm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "elm"

  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "swift"

  - package-ecosystem: "vcpkg"          # C / C++
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "cpp"
