# GitHub-native ecosystems
# Drop these entries into the `updates:` block of .github/dependabot.yml

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    labels:
      - "dependencies"
      - "actions"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    labels:
      - "dependencies"
      - "git"
